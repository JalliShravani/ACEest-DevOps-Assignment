
name: ACEest Fitness CI

on:
  push:
  pull_request:

jobs:
  build-lint:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      
      - name: Check Python syntax
        run: python -m py_compile app.py tests/test_app.py

      - name: Run Flake8 lint
        run: |
          python -m pip install flake8
          python -m flake8 app.py tests/test_app.py --max-line-length=100

      - name: Run unit tests
        run: python -m pytest -v


  docker-image-assembly:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: build-lint

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-fitness:ci .

      - name: Save Docker image
        run: docker save aceest-fitness:ci | gzip > aceest-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: aceest-docker-image
          path: aceest-image.tar.gz
          retention-days: 1

  automated-testing:
    name: Automated Testing in Container
    runs-on: ubuntu-latest
    needs: docker-image-assembly

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: aceest-docker-image

      - name: Load Docker image
        run: gunzip -c aceest-image.tar.gz | docker load

      - name: Run tests inside Docker
        run: docker run --rm aceest-fitness:ci pytest -v
